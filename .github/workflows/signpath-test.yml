name: SignPath test signing

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  sign:
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check SignPath settings
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_TEST_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_TEST_SIGNING_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
        run: |
          foreach ($name in @(
            'SIGNPATH_API_TOKEN',
            'SIGNPATH_ORGANIZATION_ID',
            'SIGNPATH_PROJECT_SLUG',
            'SIGNPATH_TEST_SIGNING_POLICY_SLUG',
            'SIGNPATH_ARTIFACT_CONFIGURATION_SLUG'
          )) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "$name is not configured."
            }
          }

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build Snowshell
        run: msbuild waifu2x_snowshell.sln /p:Configuration=Release /p:Platform=x86 /m /nologo

      - name: Upload unsigned EXE
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: snowshell-unsigned
          path: Release/waifu2x_snowshell.exe
          if-no-files-found: error

      - name: Submit test signing request
        uses: SignPath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_TEST_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Create test-signed ZIP
        shell: pwsh
        run: |
          $exe = (Resolve-Path -LiteralPath 'signed/waifu2x_snowshell.exe').Path
          $version = (Get-Item -LiteralPath $exe).VersionInfo.ProductVersion
          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw "Unexpected product version: $version"
          }

          $archiveName = "waifu2x-snowshell_v$($version -replace '\.0$', '').zip"
          $packageDirectory = (New-Item -ItemType Directory -Path 'package').FullName
          Add-Type -AssemblyName System.IO.Compression
          $archive = [System.IO.Compression.ZipFile]::Open(
            (Join-Path $packageDirectory $archiveName),
            [System.IO.Compression.ZipArchiveMode]::Create
          )
          try {
            [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile(
              $archive, $exe, 'waifu2x_snowshell.exe',
              [System.IO.Compression.CompressionLevel]::Optimal
            ) | Out-Null
            foreach ($directory in @(
              'realcugan-vulkan',
              'realesrgan-vulkan',
              'waifu2x-caffe',
              'waifu2x-converter',
              'waifu2x-ncnn-vulkan'
            )) {
              $archive.CreateEntry("$directory/") | Out-Null
            }
          } finally {
            $archive.Dispose()
          }

      - name: Upload test-signed ZIP
        uses: actions/upload-artifact@v4
        with:
          name: snowshell-test-signed-package
          path: package/*.zip
          if-no-files-found: error
